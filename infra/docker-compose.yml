# Live Polymarket trader (modele_15m) — Docker setup.
#
# Build context = repo root (one level above this file) so the Dockerfile can
# COPY backtest/ and live/. The .dockerignore is also read from the repo root.
#
# Usage (from infra/) :
#   docker compose up -d --build      # build + start in background
#   docker compose logs -f aure-live  # follow logs
#   docker compose restart aure-live  # restart (e.g. after model retrain)
#   docker compose down               # stop + remove
name: aure-live

services:
  aure-live:
    build:
      context: ..
      dockerfile: infra/Dockerfile
    container_name: aure-live
    restart: unless-stopped
    # Secrets live in live/.env (gitignored). The container reads them as env vars.
    env_file: ../live/.env
    volumes:
      # Model + sidecar mounted at /app/backtest/modele_15m/ to match
      # live/settings.py (MODEL_PATH = REPO_ROOT/backtest/modele_15m/btc_reversal_model.json).
      - ../backtest/modele_15m/btc_reversal_model.json:/app/backtest/modele_15m/btc_reversal_model.json:ro
      - ../backtest/modele_15m/btc_reversal_model.thresholds.json:/app/backtest/modele_15m/btc_reversal_model.thresholds.json:ro
      # Logs persist on host (otherwise lost on container restart).
      - ../live/logs:/app/live/logs
    # No port published: daemon only does outbound (Bitstamp + Polymarket + Telegram).
