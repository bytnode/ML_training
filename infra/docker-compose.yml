# Compose le daemon Aure live.
#
# Build context = racine du repo (un niveau au-dessus de ce fichier) pour que
# le Dockerfile puisse COPY backtest/ et live/. Le .dockerignore est aussi
# lu depuis la racine du repo.
#
# Usage (au choix, depuis infra/ OU depuis live/) :
#   docker compose up -d --build      # build + start en arriere-plan
#   docker compose logs -f aure-live  # suivre les logs
#   docker compose restart aure-live  # restart (pour reload aure.json apres replace)
#   docker compose down               # stop + remove
#
# live/docker-compose.yml inclut ce fichier via "include:" pour permettre
# de lancer aussi depuis live/. Le "name: aure-live" garantit que les deux
# entry points referent au meme projet docker.
name: aure-live

services:
  aure-live:
    build:
      context: ..
      dockerfile: infra/Dockerfile
    container_name: aure-live
    restart: unless-stopped
    env_file: ../.env
    volumes:
      # Modele + sidecar montes a /app/backtest/modele_15m/ pour matcher les chemins absolus
      # de live/settings.py (MODEL_PATH = REPO_ROOT/backtest/modele_15m/btc_reversal_model.json).
      - ../backtest/modele_15m/btc_reversal_model.json:/app/backtest/modele_15m/btc_reversal_model.json:ro
      - ../backtest/modele_15m/btc_reversal_model.thresholds.json:/app/backtest/modele_15m/btc_reversal_model.thresholds.json:ro
      # Logs et CSVs persistent en host (sinon perdus au container restart).
      - ../live/logs:/app/live/logs
    # Pas de port publie : le daemon n'a que des connexions sortantes (Bitstamp + Polymarket + Telegram).
