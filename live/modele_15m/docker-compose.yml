# Live trading container for the modele_updown 15min team.
#
# This folder is self-contained - the build context is this directory itself.
# Logs persist on host via the volume mount.
#
# Usage (from live/modele_15m/) :
#   docker compose build         # build the image
#   docker compose up -d         # start in background
#   docker compose logs -f live-team   # follow output (Rich panels render here)
#   docker compose restart live-team   # restart after retrain + rebuild
#   docker compose down                # stop + remove
name: live-team

services:
  live-team:
    build: .
    container_name: live-team
    restart: unless-stopped
    # tty=true so Rich's box-drawing + ANSI colors render properly in `docker logs -f`
    tty: true
    environment:
      - PYTHONUNBUFFERED=1
    # Telegram credentials (TELEGRAM_BOT_TOKEN, TELEGRAM_CHAT_ID) + optional
    # TELEGRAM_ERROR_BOT_TOKEN / TELEGRAM_ERROR_CHAT_ID + LIVE_MODE-related
    # Polymarket creds + RELAYER_API_KEY all live in .env. If .env is absent the
    # container still runs -- notifs become no-ops and LIVE_MODE defaults to
    # false (paper).
    env_file:
      - path: .env
        required: false
    volumes:
      # CSV logs persist on the host; survive container rebuilds.
      # /app/logs matches live.py's LOGS_DIR (ROOT = /app).
      - ./logs:/app/logs
    # No port published - live.py only does outbound calls (Bitstamp + Telegram).
