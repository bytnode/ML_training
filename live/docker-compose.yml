# Pointeur vers le vrai compose file dans infra/.
#
# Permet de lancer "docker compose up -d --build" directement depuis live/
# sans avoir a faire "cd ../infra/". Le fichier source unique reste
# infra/docker-compose.yml ; ce fichier-ci ne fait que l'inclure.
#
# Compose resout les chemins relatifs (build context, env_file, volumes) du
# fichier inclus a partir de son propre dossier, donc "../aure.json" dans
# infra/docker-compose.yml continue de pointer vers la racine du repo,
# meme quand on lance depuis live/.
#
# Le "name:" est fixe pour que "docker compose ls" affiche le meme projet
# quelle que soit la maniere dont on a lance (infra/ ou live/).
name: aure-live
include:
  - ../infra/docker-compose.yml
