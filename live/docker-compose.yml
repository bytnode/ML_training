# Compose entry point from the live/ folder.
# It just includes the real compose file in infra/. Same container, same name.
# Lets you run `docker compose up` from either live/ or infra/.
#
# Usage (from this folder):
#   docker compose up -d --build      # build + start
#   docker compose logs -f aure-live  # follow logs
#   docker compose restart aure-live  # restart (after .env or model change)
#   docker compose down               # stop + remove
name: aure-live

include:
  - ../infra/docker-compose.yml
