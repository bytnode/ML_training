# Live paper-trading container for the modele_updown team.
#
# Build context = this directory. Logs persist on host via the volume mount.
#
# Usage (from backtest/modele_updown/) :
#   docker compose build         # build the image
#   docker compose up -d         # start in background
#   docker compose logs -f live-team   # follow output (Rich panels render here)
#   docker compose restart live-team   # restart after retrain + rebuild
#   docker compose down                # stop + remove
name: live-team

services:
  live-team:
    build: .
    container_name: live-team
    restart: unless-stopped
    # tty=true so Rich's box-drawing + ANSI colors render properly in `docker logs -f`
    tty: true
    environment:
      - PYTHONUNBUFFERED=1
    volumes:
      # CSV log persists on the host; survives container rebuilds.
      - ./logs:/app/logs
    # No port published - live.py only does outbound calls (Bitstamp).
