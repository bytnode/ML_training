# Build context = modele_team/ (.. depuis live/) -- AUTONOMIE (2026-07-10) :
# live/ embarque ses propres copies de modele_up/, modele_down/, regime/
# (live/modele_up/, live/modele_down/, live/regime/), donc le contexte n'a
# plus besoin de remonter jusqu'a 1h/ pour les COPY du Dockerfile.
# ⚠️ DEPLOIEMENT DE TEST (branche algov2_test) -- CE N'EST PAS LA PROD.
# Tous les noms portent le suffixe -test pour que rien ne puisse entrer en
# collision avec le deploiement de production sur le meme VPS :
#   - `name:` fixe le PROJET Compose. Sans lui, Compose prend le nom du dossier
#     du fichier (= "live"), IDENTIQUE cote prod -- un `docker compose down`
#     lance ici aurait arrete la prod. Plus besoin de passer -p a la main.
#   - `container_name` distinct : deux conteneurs ne peuvent pas partager un nom.
#   - le service s'appelle live-okx-test : c'est le nom a utiliser dans
#     `docker compose logs -f live-okx-test`.
# ⚠️ Si cette branche est un jour fusionnee vers la prod, RETIRER ces suffixes
# (ou la prod tournerait sous des noms de test).
name: live-okx-test

services:
  live-okx-test:
    build:
      context: ..
      dockerfile: live/Dockerfile
    container_name: live-okx-1h-test
    restart: unless-stopped
    tty: true
    env_file:
      - ./.env
    volumes:
      - ./logs:/app/modele_team/live/logs
      # PLUS de montage SQLite (campagne autonomie 2026-07-10) : live/ ne touche
      # plus jamais la DB de modele_down, ni pour le DMI par-trade (buffer 4h
      # Bitstamp local, cf market_data.py) ni pour le regime (graine
      # regime/regime_seed.json + etat incremental persiste dans ./logs/
      # regime_state.json, cf regime_live.py).
