# Live trading container for the modele_updown team (15min timeframe).
#
# Build context is the parent directory (backtest/modele_updown/15min/) so the
# Dockerfile can COPY from sibling modele_up/ and modele_down/. Compose itself
# runs from this folder (backtest/modele_updown/15min/live/). Logs persist on
# host via the volume mount.
#
# Usage (from backtest/modele_updown/15min/live/) :
#   docker compose build         # build the image
#   docker compose up -d         # start in background
#   docker compose logs -f live-team   # follow output (Rich panels render here)
#   docker compose restart live-team   # restart after retrain + rebuild
#   docker compose down                # stop + remove
name: live-team

services:
  live-team:
    build:
      context: ..
      dockerfile: live/Dockerfile
    container_name: live-team
    restart: unless-stopped
    # tty=true so Rich's box-drawing + ANSI colors render properly in `docker logs -f`
    tty: true
    environment:
      - PYTHONUNBUFFERED=1
    # Telegram credentials (TELEGRAM_BOT_TOKEN, TELEGRAM_CHAT_ID) + optional
    # TELEGRAM_ERROR_BOT_TOKEN / TELEGRAM_ERROR_CHAT_ID + LIVE_MODE-related
    # Polymarket creds all live in .env. If .env is absent the container still
    # runs -- notifs become no-ops and LIVE_MODE defaults to false (paper).
    env_file:
      - path: .env
        required: false
    volumes:
      # CSV log persists on the host; survives container rebuilds.
      # /app/15min/live/logs matches live.py's LOGS_DIR (ROOT = /app/15min/live/).
      - ./logs:/app/15min/live/logs
    # No port published - live.py only does outbound calls (Bitstamp + Telegram).
